[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "bm25s>=0.3.11",
    "chromadb>=1.5.9",
    "diskcache>=5.6.3",
    "fastapi[standard]>=0.142.2",
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "langchain-text-splitters>=1.1.2",
    "mypy>=2.4.0",
    "pyclean>=3.7.0",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[tool.fastapi]
entrypoint = "src.web-interface:app"

[tool.mypy]
exclude = [
    "data",
    ".env"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
